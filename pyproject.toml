[project]
name = "router-warm"
version = "0.1.0"
description = "Thin OpenAI-compatible router: z.ai (GLM) classifies, requests proxy to z.ai / claude-warm / codex-warm."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
router-warm-gateway = "router_warm.gateway:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["router_warm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
